<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Hotel Details | BookMyStay

    </title>

    <link
        rel="stylesheet"
        href="./css/hotel-details.css">

</head>

<body>

<div class="container">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="brand">

            BookMyStay

        </div>

        <div class="profile">

            <div class="avatar">

                👤

            </div>

            <div
                class="name"
                id="userName">

                User Name

            </div>

            <div
                class="tier"
                id="userRole">

                User

            </div>

        </div>

        <nav>

            <ul>

                <li>

                    <a href="user-dashboard.html">

                        🏠 Dashboard

                    </a>

                </li>

                <!-- <li class="active">

                    <a href="search.html">

                        🔍 Search Hotels

                    </a>

                </li> -->

                <li>

                    <a href="bookings.html">

                        📅 My Bookings

                    </a>

                </li>

                <li>

                    <a href="settings.html">

                        ⚙ Settings

                    </a>

                </li>

            </ul>

        </nav>

        <button

            id="logoutBtn"

            class="logout-btn">

            Logout

        </button>

    </aside>

    <!-- ================= Main ================= -->

    <main class="main">

        <div class="topbar">

            <h1>

                Hotel Details

            </h1>

        </div>

        <!-- Hotel -->

        <div class="hotel-details">

            <img

                id="hotelImage"

                src=""

                alt="Hotel">

            <div class="hotel-info">

                <h2 id="hotelName">

                    Hotel Name

                </h2>

                <p id="hotelLocation">

                    Location

                </p>

                <p id="hotelRating">

                    ⭐

                </p>

                <p id="hotelPrice">

                    ₹0 / Night

                </p>

                <p id="hotelDescription">

                    Description

                </p>

            </div>

        </div>

        <!-- Rooms -->

        <div class="room-section">

            <h2>

                Available Rooms

            </h2>

            <div
                id="roomContainer"
                class="room-container">

                <!-- Dynamic -->

            </div>

        </div>

    </main>

</div>

<script src="./js/hotel-details.js"></script>

</body>

</html>
