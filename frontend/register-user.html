<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <link rel="stylesheet" href="./css/register-user.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>User Registration</h1>

            <form id="registerForm">

                <input type="text"
                    id="fullName"
                    placeholder="Full Name"
                    required>

                <input type="email"
                    id="email"
                    placeholder="Email"
                    required>

                <input
                   type="tel"
                   id="phone"
                    placeholder="Phone Number"
                    required>

                <input type="password"
                    id="password"
                    placeholder="Password"
                    required>

                <input type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

                <input type="text"
                    id="country"
                    placeholder="Country"
                    required>

                <input type="text"
                    id="state"
                    placeholder="State"
                    required>

                <input type="text"
                    id="city"
                    placeholder="City"
                    required>


                <button type="submit">
                    Register
                </button>

            </form>

            <p>
                Already have an account?
            </p>

            <a href="login.html">
                Login
            </a>

        </div>

    </div>
    <script>
    
</script>

    <script src="./js/register-user.js"></script>

</body>

</html>
